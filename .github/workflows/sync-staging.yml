# Keep long-lived `staging` identical to `main` (agent-os-0003).
# Mirror only — do not commit feature work on `staging`.
name: Sync staging from main

on:
  push:
    branches: [main]

concurrency:
  group: sync-staging
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Force-push main → staging
        run: git push --force origin "HEAD:staging"
